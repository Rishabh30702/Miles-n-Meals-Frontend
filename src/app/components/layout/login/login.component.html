<div class="login-page" [class.dark-theme]="themeService.darkMode()">
  <div class="login-card">
    <div class="login-header">
      <h2>Staff Portal</h2>
      <p>Welcome back! Please login to your account.</p>
    </div>

    <form>
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <span class="material-icons">email</span>
          <input type="email" placeholder="admin&#64;milesnmeals.com">
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span class="material-icons">lock</span>
          <input type="password" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="w-100">Sign In</button>
    </form>

    <div class="login-footer">
      Need help? <a routerLink="/contacts">Contact Support</a>
    </div>
  </div>
</div>
